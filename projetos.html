<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Nathália de Bona</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="projetos.css">
</head>

<body>
    <header>
        <nav>
            <span>✦ nathália</span>

            <ul>
                <li><a href="index.html#sobre" data-pt="Sobre" data-en="About">Sobre</a></li>
                <li><a href="index.html#habilidades" data-pt="Habilidades" data-en="Skills">Habilidades</a></li>
                <li><a href="projetos.html" data-pt="Projetos" data-en="Projects">Projetos</a></li>
                <li><a href="index.html#contato" data-pt="Contato" data-en="Contact">Contato</a></li>
            </ul>

            <div class="nav-botoes">
                <button id="btn-menu" aria-label="Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <button id="toggle-idioma">EN</button>
            </div>
        </nav>
    </header>

    <main class="projetos-main">
        <section class="projetos-intro">
            <h1><span data-pt="Projetos" data-en="Projects">Projetos</span><span class="ponto">.</span></h1>

            <p data-pt="Mais de 20 projetos feitos do zero. Use os filtros para encontrar o que mais combina com você."
                data-en="More than 20 projects built from scratch. Use the filters to find the one that best suits you.">
                Mais de 20 projetos feitos do zero. Use os filtros para encontrar o que mais combina com você.
            </p>
        </section>

        <div class="filtros">
            <div class="filtro-linha">
                <span class="filtro-rotulo" data-pt="Mostrar" data-en="Show">Mostrar</span>

                <div class="filtro-chips">
                    <button type="button" class="chip" data-filtro="mostrar" data-valor="destaques"
                            aria-pressed="true" data-pt="Destaques" data-en="Featured">Destaques</button>

                    <button type="button" class="chip" data-filtro="mostrar" data-valor="todos"
                            aria-pressed="false" data-pt="Todos" data-en="All">Todos</button>
                </div>
            </div>

            <div class="filtro-linha">
                <span class="filtro-rotulo" data-pt="Tipo" data-en="Type">Tipo</span>

                <div class="filtro-chips">
                    <button type="button" class="chip" data-filtro="tipo" data-valor="todos"
                            aria-pressed="true" data-pt="Todos" data-en="All">Todos</button>

                    <button type="button" class="chip" data-filtro="tipo" data-valor="pagina-unica"
                            aria-pressed="false" data-pt="Páginas únicas" data-en="Single pages">Páginas únicas</button>

                    <button type="button" class="chip" data-filtro="tipo" data-valor="varias-paginas"
                            aria-pressed="false" data-pt="Sites com várias páginas" data-en="Multi-page sites">Sites com várias páginas</button>

                    <button type="button" class="chip" data-filtro="tipo" data-valor="app"
                            aria-pressed="false" data-pt="Apps interativos" data-en="Interactive apps">Apps interativos</button>

                    <button type="button" class="chip" data-filtro="tipo" data-valor="backend"
                            aria-pressed="false" data-pt="Com backend" data-en="With backend">Com backend</button>
                </div>
            </div>
        </div>

        <section class="projetos-lista">
            <p class="contagem" id="contagem"></p>
            <div class="lista-projetos" id="lista-projetos"></div>
        </section>
    </main>

    <footer>
        <p>&#169; 2026 Nathália de Bona</p>

        <div class="redes-sociais">
            <a href="https://github.com/nathaliadebona">GitHub</a>
            <a href="https://www.linkedin.com/in/nathaliadalila/">LinkedIn</a>
        </div>
    </footer>

    <dialog id="modal-projeto">
        <button class="btn-fechar"><i class="fa-solid fa-circle-xmark"></i></button>

        <div class="modal-conteudo">
            <div class="modal-info">
                <h3></h3>
                <p></p>

                <div class="modal-tags">
                    <ul>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>

                    <ul>
                        <li></li>
                        <li></li>
                    </ul>
                </div>

                <a href="" class="btn-ver-site"></a>
            </div>
        </div>
    </dialog>

    <button id="btn-topo" aria-label="Voltar ao topo">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <script src="script.js"></script>
    <script src="projetos.js"></script>
</body>
</html>
